<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwriting Practice Sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Kalam:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* A4 Page Setup */
        @page {
            size: A4;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #9e9e9e; /* Light Gray for Tracing */
            /* Handwriting Font Family */
            font-family: 'Kalam', 'Caveat', cursive; 
            font-size: 20px; /* Bada size taaki likhne me aasani ho */
            line-height: 30px; /* Matches the background lines */
            -webkit-print-color-adjust: exact;
        }

        .page-container {
            width: 210mm;
            min-height: 297mm;
            margin: auto;
            background-color: white;
            position: relative;
            padding: 40px 20mm;
            box-sizing: border-box;
            
            /* Notebook Paper Lines Effect */
            background-image: 
                linear-gradient(#999 1px, transparent 1px), /* Margin Line */
                repeating-linear-gradient(transparent, transparent 29px, #afe0ff 30px); /* Blue Lines */
            background-size: 100% 100%, 100% 30px;
            background-attachment: local;
        }

        /* Red Margin Line on the Left */
        .page-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 20mm;
            width: 2px;
            background-color: #ffaacc; /* Red margin line */
            border-right: 1px solid #ffaacc;
            z-index: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            padding-left: 10px; /* Slight offset from red line */
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #9e9e9e;
            padding-bottom: 10px;
        }

        .header h1 {
            font-family: 'Caveat', cursive;
            font-size: 36px;
            color: #b0b0b0; /* Light gray for tracing */
            margin: 0;
            font-weight: bold;
        }

        .header p {
            color: #b0b0b0;
            font-size: 18px;
            margin-top: 5px;
        }

        .qa-card {
            margin-bottom: 30px; /* Space between questions */
            break-inside: avoid; /* Prevents cutting questions in half while printing */
        }

        .q-num {
            font-size: 18px;
            color: #b0b0b0; 
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 0px;
        }

        .question {
            font-size: 22px;
            font-weight: bold;
            color: #888888; /* Slightly darker gray for Question to differentiate */
            margin-bottom: 5px;
            display: block;
        }

        .answer {
            font-size: 20px;
            color: #d1d1d1; /* Very Light Gray - Perfect for tracing over */
            text-align: left;
            white-space: pre-wrap; 
            letter-spacing: 1px; /* Thoda gap taaki likhne me saaf dikhe */
        }

        /* Tags styles (simplified for paper look) */
        .type-tag {
            font-size: 14px;
            border: 1px solid #ccc;
            padding: 0 5px;
            border-radius: 10px;
            margin-left: 10px;
            vertical-align: middle;
        }

        @media print {
            body {
                background: white;
            }
            .page-container {
                width: 100%;
                margin: 0;
                box-shadow: none;
                /* Force background graphics to print */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="content-wrapper">
            <div class="header">
                <h1>English Assignment</h1>
                <p>Class 11 & 12 • Practice Sheet</p>
            </div>

            <div id="content-area">
                </div>
        </div>
    </div>

    <script>
        const database = [
            // CLASS 12 - FLAMINGO & VISTAS
            {
                type: "Short",
                q: "Q: Why did M. Hamel blame himself?",
                a: "A: M. Hamel blamed himself because he often sent Franz to water his flowers instead of learning lessons. He also gave holidays when he wanted to go fishing."
            },
            {
                type: "Long",
                q: "Q: Describe the Tiger King's character.",
                a: "A: The Maharaja is whimsical and arrogant. Obsessed with the prophecy, he kills 99 tigers, ignoring his duties. His death by a wooden toy is poetic justice."
            },
            {
                type: "Short",
                q: "Q: What is the 'misadventure' Douglas speaks of?",
                a: "A: It refers to the incident at the YMCA pool where a big boy threw him into the deep end, causing him to nearly drown and fear water forever."
            },
            {
                type: "Long",
                q: "Q: Contrast in 'My Mother at Sixty-six'.",
                a: "A: Inside the car, the mother looks like a corpse (decay). Outside, young trees sprinting and merry children symbolize life, energy, and vitality."
            },
            {
                type: "Short",
                q: "Q: Why was the crofter so friendly?",
                a: "A: The crofter was lonely without a wife or children. He was happy to have someone to talk to, so he was generous to the peddler."
            },
            {
                type: "Long",
                q: "Q: Was Dr. Sadao right in 'The Enemy'?",
                a: "A: Yes. He upheld his medical oath to save a life. By letting the soldier escape later, he balanced his professional duty with his patriotism."
            },
            {
                type: "Short",
                q: "Q: What does the 'Third Level' symbolize?",
                a: "A: It symbolizes an escape for Charley from the harsh realities of the modern world (war, worry) to the peaceful past of the 1890s."
            },
            {
                type: "Short",
                q: "Q: Why did the grandmother hate music?",
                a: "A: She believed music was for harlots and beggars, not for gentlefolk. She was distressed that it was taught at school."
            },
            {
                type: "Long",
                q: "Q: Justify the title 'Lost Spring'.",
                a: "A: Spring represents childhood happiness. For children like Saheb and Mukesh, forced into labor, this 'spring' is lost to poverty and crushing responsibilities."
            },
            {
                type: "Short",
                q: "Q: Significance of the bulletin board?",
                a: "A: It was the source of all bad news—lost battles and drafts. A crowd there meant something bad had happened again in Alsace."
            },
            // ... (Adding more items to fill page for demo) ...
             {
                type: "Short",
                q: "Q: Why keep quiet (Pablo Neruda)?",
                a: "A: Keeping quiet allows us to introspect, stop destructive activities, and build mutual understanding among human beings."
            }
        ];

        function loadQuestions() {
            const container = document.getElementById('content-area');
            // Generating enough to fill a page or two
            let totalNeeded = 12; 
            let currentIndex = 0;

            for (let i = 1; i <= totalNeeded; i++) {
                const data = database[currentIndex];
                
                const card = document.createElement('div');
                card.className = 'qa-card';

                card.innerHTML = `
                    <div class="q-num">${i}. ${data.type} Answer</div>
                    <div class="question">${data.q}</div>
                    <div class="answer">${data.a}</div>
                `;

                container.appendChild(card);
                currentIndex++;
                if (currentIndex >= database.length) currentIndex = 0;
            }
        }

        loadQuestions();
    </script>
</body>
</html>
